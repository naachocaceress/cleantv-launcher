plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // Optional name for the greeting ("Good evening, Alex"): tvhome.userName=Alex in launcher/local.properties.
    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

    defaultConfig {
        resValue 'string', 'user_name', localProps.getProperty('tvhome.userName', '')
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 3
        versionName '2.1'
    }

    // One fixed key for every build, committed on purpose: an update installs over the previous one and keeps the
    // launcher's settings (Android refuses an update signed with a different key and the only way out is to uninstall,
    // which wipes them). It is the stock debug key, with its well known password; this is a sideloaded home screen,
    // not a store app, so nothing is protected by keeping it secret. See "Updating" in the README.
    signingConfigs {
        cleantv {
            storeFile rootProject.file('signing/cleantv.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.cleantv
        }
        release {
            signingConfig signingConfigs.cleantv
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
